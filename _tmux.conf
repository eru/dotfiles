# Prefix
set-option -g prefix C-z
bind-key C-z send-prefix

# View
set -g message-style bg="red","bold",fg="white"
set -g pane-active-border-style bg="black",fg="cyan"

set -g default-terminal "screen-256color"

# Options

# コピー、選択モードのキーバインドvi/emacs
set-window-option -g mode-keys vi

# vでマーク開始
bind-key -T copy-mode-vi v send-keys -X begin-selection

# yでヤンク
bind-key -T copy-mode-vi y send-keys -X copy-selection

# ウィンドウ等の番号基準値
set-option -g base-index 1
set-option -g pane-base-index 1

# mouse
set-option -g mouse on

# shell
set-option -g default-command zsh
if-shell 'test "$(uname -s)" = Darwin' 'set-option -g default-command "reattach-to-user-namespace -l zsh"'

# neovim
set -g escape-time 10
set -g focus-events on

# terminal-browser (kitty graphics protocol で画像を描画する端末内ブラウザ) を tmux 上で使うための設定
# - allow-passthrough: kitty graphics のエスケープシーケンスを外側の端末 (Ghostty) へ素通しする
# - PIXEL_SKIP_GRAPHICS_CHECK: 起動時のグラフィック対応判定をスキップする。
#   判定は kitty graphics の問い合わせと DA1 (ESC[c) を送って応答を見るが、tmux 内では
#   DA1 に tmux 自身が即答し、Ghostty の kitty graphics 応答はペインに戻らないため
#   「Unsupported terminal」と誤判定されて起動できない (--split だと無言でハングする)
set -g allow-passthrough on
set-environment -g PIXEL_SKIP_GRAPHICS_CHECK 1

# title
setw -g allow-rename on
# ウィンドウ名: シェルならカレントディレクトリ名、コマンド実行中は "コマンド | ディレクトリ名"
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command} | #{b:pane_current_path}}}#{?pane_dead,[dead],}'
set-option -g set-titles on
set-option -g set-titles-string "#T #{session_alerts}"

# KeyBindings
unbind l
unbind ^C
unbind x

bind C-r source-file $HOME/.tmux.conf
bind C-t next-window
bind c new-window -c "#{pane_current_path}"

bind -r C-h resize-pane -L 6
bind -r C-l resize-pane -R 6
bind -r C-j resize-pane -D 6
bind -r C-k resize-pane -U 6
bind -r s swap-pane -U

bind -n S-left select-pane -L
bind -n S-down select-pane -D
bind -n S-up select-pane -U
bind -n S-right select-pane -R

bind k kill-pane
bind K kill-window
bind i display-panes
bind y copy-mode
bind p paste-buffer

bind b break-pane
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind y copy-mode
bind p paste-buffer

bind Space choose-window

## tmux plugin manager
source $HOME/dotfiles/_tmux/tpm.conf

# tmux-powerline の window-format は #() で毎描画ごとに bash を起動し、
# Defender(epsext) の負荷を上げるため、出力結果を静的に書いて上書きする
# (themes/default.sh のウィンドウ部分を変えたら powerline.sh window-format / window-current-format の出力で更新すること)
set -g window-status-format '#[fg=colour255,bg=colour235,nobold,noitalics,nounderscore]  #I#{?window_flags,#F, }  #W '
set -g window-status-current-format '#[fg=colour235,bg=colour255,nobold,noitalics,nounderscore] #I#F  #W #[fg=colour255,bg=colour235,nobold,noitalics,nounderscore]'
# left/right も再描画のたびに powerline.sh が走るので、キャッシュ付きラッパー経由にする
set -g status-left '#($HOME/dotfiles/_tmux/powerline-cached.zsh left 30)'
set -g status-right '#($HOME/dotfiles/_tmux/powerline-cached.zsh right 30)'
